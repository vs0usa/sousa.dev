name: Dependabot automerge

# Runs after CI has finished rather than on the pull request itself, so a merge
# only happens once every job has genuinely passed.
#
# The previous version called `gh pr merge --auto` from pull_request_target.
# That failed on every Dependabot pull request, because auto-merge is not
# enabled on this repository. Enabling it would have been worse: with no
# required status checks configured, auto-merge lands a pull request as soon as
# it is mergeable, without waiting for CI. Gating here keeps that decision in
# the workflow rather than in repository settings.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request when Dependabot opened it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          number=$(
            gh pr list --repo "$REPO" --state open --json number,headRefOid,author \
              --jq "[
                .[]
                | select(.headRefOid == \"$HEAD_SHA\")
                | select(.author.login == \"app/dependabot\" or .author.login == \"dependabot[bot]\")
              ] | first | .number // empty"
          )

          if [ -z "$number" ]; then
            echo "No open Dependabot pull request at $HEAD_SHA. Nothing to merge."
            exit 0
          fi

          echo "CI passed for Dependabot pull request #$number; merging."
          gh pr merge --repo "$REPO" --squash --delete-branch "$number"
