name: Dependabot automerge

# Replaces Renovate's automerge: true. Runs on pull_request_target because the
# GITHUB_TOKEN handed to workflows on Dependabot pull_request events is
# read-only. Nothing from the PR branch is checked out or executed here, which
# is what makes pull_request_target safe in this workflow.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Queues the PR to merge once every required status check passes. This
      # needs "Allow auto-merge" enabled on the repository, and CI listed as
      # required, otherwise the PR merges immediately without waiting.
      - name: Enable auto-merge
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
